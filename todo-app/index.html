<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>📝 My To-Do List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Statistics -->
            <div class="stats-container">
                <div class="stat-card">
                    <span class="stat-label">Total Tasks</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
                <div class="stat-card active">
                    <span class="stat-label">Active</span>
                    <span class="stat-value" id="activeTasks">0</span>
                </div>
                <div class="stat-card completed">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value" id="completedTasks">0</span>
                </div>
            </div>

            <!-- Input Section -->
            <div class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="Add a new task... (Press Enter)"
                        autocomplete="off"
                    >
                    <button class="btn-add" id="addBtn" title="Add task">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-th-large"></i> All
                </button>
                <button class="filter-btn" data-filter="active">
                    <i class="fas fa-circle"></i> Active
                </button>
                <button class="filter-btn" data-filter="completed">
                    <i class="fas fa-check-circle"></i> Completed
                </button>
                <button class="btn-clear" id="clearCompleted" title="Clear completed tasks">
                    <i class="fas fa-trash"></i> Clear Completed
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="progress-section">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text" id="progressText">0% Complete</p>
            </div>

            <!-- Task List -->
            <div class="tasks-container">
                <ul class="task-list" id="taskList">
                    <!-- Tasks will be inserted here -->
                </ul>
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-inbox"></i>
                    <p>No tasks yet. Add one to get started!</p>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>💾 Your tasks are automatically saved to local storage</p>
            <p class="version">v1.0.0 | Made with ❤️</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="storage.js"></script>
    <script src="ui.js"></script>
    <script src="app.js"></script>
</body>
</html>
