<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniAI - Vijay's AI Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <style>
    pre code { border-radius: 0.5rem; }
    .chat-container::-webkit-scrollbar { width: 6px; }
    .chat-container::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 flex h-screen font-sans overflow-hidden">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-72 bg-gray-900 border-r border-gray-800 flex flex-col transition-all duration-300 z-30 fixed inset-y-0 left-0 -translate-x-full md:relative md:translate-x-0">
    <div class="p-4 border-b border-gray-800 flex justify-between items-center">
      <button onclick="startNewChat()" class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm flex items-center justify-center gap-2 shadow">
        ➕ Nayi Chat
      </button>
      <button onclick="toggleSidebar()" class="md:hidden ml-2 text-gray-400 hover:text-white text-lg px-2">✕</button>
    </div>

    <div class="flex-1 overflow-y-auto p-3 space-y-1 chat-container" id="historyList"></div>

    <div class="p-3 border-t border-gray-800 bg-gray-900/60 space-y-2">
      <div class="flex items-center justify-between text-xs text-gray-400">
        <span id="userBadge" class="truncate font-medium text-gray-300">👤 Guest</span>
        <button onclick="openLoginModal()" class="text-blue-400 hover:underline">Login</button>
      </div>
      <div class="flex gap-2">
        <button onclick="openFeedbackModal()" class="flex-1 text-xs bg-gray-800 hover:bg-gray-700 py-2 rounded-lg border border-gray-700 text-gray-300">
          💬 Feedback
        </button>
        <button onclick="openOwnerSettings()" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-2 rounded-lg border border-gray-700 text-gray-300">
          ⚙️ Key
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Section -->
  <div class="flex-1 flex flex-col h-full relative">
    <header class="p-3.5 bg-gray-900 border-b border-gray-800 flex justify-between items-center shadow-md">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="md:hidden text-gray-300 bg-gray-800 p-2 rounded-lg">☰</button>
        <div>
          <h1 class="text-lg font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
            OmniAI Free Hub
          </h1>
          <p class="text-[11px] text-emerald-400">● 100% Free • Unlimited • Multimodal</p>
        </div>
      </div>
      <label class="flex items-center gap-1.5 cursor-pointer text-xs bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700 select-none">
        <span>🔊 Bolkar Jawab</span>
        <input type="checkbox" id="voiceToggle" class="accent-blue-500 rounded cursor-pointer">
      </label>
    </header>

    <main id="chatBox" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 chat-container">
      <div class="bg-gray-900/90 p-5 rounded-2xl border border-gray-800 max-w-2xl mx-auto text-sm text-gray-300 shadow-lg space-y-3">
        <h2 class="text-base font-bold text-white flex items-center gap-2">👋 OmniAI me aapka swagat hai!</h2>
        <p class="text-xs text-gray-400">Sabhi ke liye 100% Free: Q&A, Code, Image Modification, Excel Sheets, Cartoon Creation aur sabkuch.</p>
      </div>
    </main>

    <div id="mediaPreviewBar" class="hidden px-4 py-2 bg-gray-900 border-t border-gray-800 flex items-center gap-3">
      <div id="mediaThumbnail" class="w-12 h-12 rounded-lg bg-gray-800 border border-gray-700 flex items-center justify-center overflow-hidden text-xs"></div>
      <div class="flex-1">
        <div id="mediaFileName" class="text-xs font-medium text-gray-200 truncate">file.png</div>
        <div id="mediaActionText" class="text-[11px] text-blue-400">Attach ho gaya</div>
      </div>
      <button onclick="removeAttachedMedia()" class="text-gray-400 hover:text-red-400 text-sm px-2">✕ Hatao</button>
    </div>

    <footer class="p-3 md:p-4 bg-gray-900 border-t border-gray-800">
      <div class="max-w-4xl mx-auto flex flex-col gap-2">
        <div class="flex items-center gap-2 text-xs overflow-x-auto pb-1 text-gray-400">
          <label class="cursor-pointer bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg border border-gray-700 whitespace-nowrap">
            📷 Image Upload
            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleFileUpload(event, 'image')">
          </label>
          <label class="cursor-pointer bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg border border-gray-700 whitespace-nowrap">
            🎥 Video Upload
            <input type="file" id="videoInput" accept="video/*" class="hidden" onchange="handleFileUpload(event, 'video')">
          </label>
          <button onclick="insertTemplate('/image ')" class="bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg border border-gray-700 whitespace-nowrap">🎨 Image Generator</button>
          <button onclick="insertTemplate('/cartoon ')" class="bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg border border-gray-700 whitespace-nowrap">🧸 Cartoon Maker</button>
        </div>

        <div class="flex gap-2 items-center">
          <textarea id="userInput" rows="1" placeholder="Kuch bhi poochein ya prompt likhein..." 
            class="flex-1 bg-gray-800 text-white rounded-xl px-4 py-3 border border-gray-700 focus:outline-none focus:border-blue-500 resize-none text-sm"></textarea>
          <button onclick="handleSend()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-3 rounded-xl font-medium text-sm transition">
            Bhejo 🚀
          </button>
        </div>
      </div>
    </footer>
  </div>

  <!-- Modals -->
  <div id="loginModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 max-w-sm w-full space-y-4">
      <h3 class="text-base font-bold text-white">🔐 Login / Sign Up</h3>
      <input type="text" id="loginIdentifier" placeholder="Email ya Mobile Number" class="w-full bg-gray-800 text-white px-3.5 py-2.5 rounded-xl border border-gray-700 text-sm">
      <div class="flex gap-2">
        <button onclick="saveUserLogin()" class="flex-1 bg-blue-600 text-white py-2 rounded-xl text-sm font-medium">Save</button>
        <button onclick="closeLoginModal()" class="flex-1 bg-gray-800 text-gray-300 py-2 rounded-xl text-sm border border-gray-700">Cancel</button>
      </div>
    </div>
  </div>

  <div id="feedbackModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 max-w-md w-full space-y-4">
      <h3 class="text-base font-bold text-blue-400">💬 Feedback & Support</h3>
      <textarea id="feedbackText" rows="3" placeholder="Apna feedback yahan likhein..." class="w-full bg-gray-800 text-white p-3 rounded-xl border border-gray-700 text-sm"></textarea>
      <div class="flex gap-2">
        <button onclick="sendFeedbackWhatsApp()" class="flex-1 bg-green-600 text-white py-2 rounded-xl text-xs font-medium">WhatsApp Karein</button>
        <button onclick="closeFeedbackModal()" class="flex-1 bg-gray-700 text-white py-2 rounded-xl text-xs">Band Karein</button>
      </div>
    </div>
  </div>

  <script>
    let attachedMedia = null;
    let chatSessions = JSON.parse(localStorage.getItem('omni_chat_sessions') || '[]');
    let currentSessionId = Date.now().toString();

    const abusiveWords = ['gali', 'chutiya', 'madarchod', 'bhenchod', 'bhosdike', 'gandu', 'harami', 'kutta', 'kamina', 'saale', 'mc', 'bc', 'fuck', 'bitch'];

    function checkAbusive(text) {
      const lower = text.toLowerCase();
      return abusiveWords.some(w => lower.includes(w));
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }

    function renderHistory() {
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';
      if (chatSessions.length === 0) {
        historyList.innerHTML = '<div class="text-xs text-gray-500 text-center py-4">Koi chat nahi hai</div>';
        return;
      }
      chatSessions.forEach(sess => {
        const item = document.createElement('div');
        item.className = `p-2.5 rounded-xl text-xs truncate cursor-pointer flex justify-between items-center ${sess.id === currentSessionId ? 'bg-blue-600/20 text-blue-300 border border-blue-500/30' : 'hover:bg-gray-800 text-gray-300'}`;
        item.innerHTML = `<span class="truncate flex-1" onclick="loadSession('${sess.id}')">💬 ${sess.title}</span><button onclick="deleteSession('${sess.id}', event)" class="text-gray-500 hover:text-red-400 px-1">✕</button>`;
        historyList.appendChild(item);
      });
    }

    function saveCurrentSession(firstPrompt) {
      let session = chatSessions.find(s => s.id === currentSessionId);
      if (!session) {
        session = { id: currentSessionId, title: firstPrompt.slice(0, 24) + '...', messages: [] };
        chatSessions.unshift(session);
      }
      localStorage.setItem('omni_chat_sessions', JSON.stringify(chatSessions));
      renderHistory();
    }

    function loadSession(id) {
      currentSessionId = id;
      const session = chatSessions.find(s => s.id === id);
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';
      if (session && session.messages) {
        session.messages.forEach(m => appendMessage(m.sender, m.content, false));
      }
      renderHistory();
    }

    function deleteSession(id, e) {
      e.stopPropagation();
      chatSessions = chatSessions.filter(s => s.id !== id);
      localStorage.setItem('omni_chat_sessions', JSON.stringify(chatSessions));
      if (currentSessionId === id) startNewChat();
      else renderHistory();
    }

    function startNewChat() {
      currentSessionId = Date.now().toString();
      document.getElementById('chatBox').innerHTML = `<div class="bg-gray-900/90 p-5 rounded-2xl border border-gray-800 max-w-2xl mx-auto text-sm text-gray-300 shadow-lg"><h2 class="text-base font-bold text-white">Nayi Chat Shuru Hui</h2></div>`;
      renderHistory();
    }

    function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
    function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }
    function saveUserLogin() {
      const val = document.getElementById('loginIdentifier').value.trim();
      if (val) {
        localStorage.setItem('omni_user_login', val);
        updateUserBadge();
        closeLoginModal();
      }
    }
    function updateUserBadge() {
      const user = localStorage.getItem('omni_user_login');
      document.getElementById('userBadge').innerText = user ? `👤 ${user}` : '👤 Guest';
    }

    function openFeedbackModal() { document.getElementById('feedbackModal').classList.remove('hidden'); }
    function closeFeedbackModal() { document.getElementById('feedbackModal').classList.add('hidden'); }
    function sendFeedbackWhatsApp() {
      const fb = document.getElementById('feedbackText').value.trim() || 'No feedback';
      window.open(`https://wa.me/917990565202?text=${encodeURIComponent('OmniAI Feedback: ' + fb)}`, '_blank');
      closeFeedbackModal();
    }

    function openOwnerSettings() {
      const key = prompt('Apni Free Google Gemini API Key enter karein (aistudio.google.com se):', localStorage.getItem('gemini_api_key') || '');
      if (key !== null) {
        localStorage.setItem('gemini_api_key', key.trim());
        alert('API Key Save ho gayi!');
      }
    }

    function handleFileUpload(event, type) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        attachedMedia = { type, name: file.name, dataUrl: e.target.result, mimeType: file.type };
        document.getElementById('mediaFileName').innerText = file.name;
        document.getElementById('mediaThumbnail').innerHTML = type === 'image' ? `<img src="${e.target.result}" class="w-full h-full object-cover">` : '🎥';
        document.getElementById('mediaPreviewBar').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function removeAttachedMedia() {
      attachedMedia = null;
      document.getElementById('mediaPreviewBar').classList.add('hidden');
    }

    function insertTemplate(str) {
      const inp = document.getElementById('userInput');
      inp.value = str;
      inp.focus();
    }

    const userInput = document.getElementById('userInput');
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    async function handleSend() {
      let text = userInput.value.trim();
      if (!text && !attachedMedia) return;

      if (!text && attachedMedia) text = 'Explain this file';

      if (checkAbusive(text)) {
        appendMessage('user', text);
        userInput.value = '';
        removeAttachedMedia();
        const politeReply = "Aapka aadar hamare liye zaroori hai. Kripya shisht bhasha ka upyog karein taaki main behtar sahayata kar sakoon. Kahiye main aapki kya madad kar sakta hoon? 😊";
        appendMessage('bot', politeReply);
        speakText(politeReply);
        return;
      }

      appendMessage('user', text, true, attachedMedia);
      saveCurrentSession(text);
      userInput.value = '';

      if (text.startsWith('/image ') || text.startsWith('/cartoon ')) {
        const isCartoon = text.startsWith('/cartoon ');
        let prompt = text.replace(isCartoon ? '/cartoon ' : '/image ', '').trim();
        if (isCartoon) prompt = `${prompt}, cute 3d disney pixar animation cartoon style`;
        removeAttachedMedia();
        generateImage(prompt);
        return;
      }

      const mediaPayload = attachedMedia ? { ...attachedMedia } : null;
      removeAttachedMedia();
      generateAIContent(text, mediaPayload);
    }

    function appendMessage(sender, content, recordInHistory = true, media = null) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

      const innerDiv = document.createElement('div');
      innerDiv.className = `max-w-2xl p-4 rounded-2xl ${sender === 'user' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-200 border border-gray-700'}`;

      if (media && media.type === 'image') {
        innerDiv.innerHTML += `<img src="${media.dataUrl}" class="rounded-lg mb-2 max-h-48 border border-gray-600">`;
      }

      if (sender === 'bot') {
        innerDiv.innerHTML += marked.parse(content);
        innerDiv.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
      } else {
        const t = document.createElement('div');
        t.innerText = content;
        innerDiv.appendChild(t);
      }

      msgDiv.appendChild(innerDiv);
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      if (recordInHistory) {
        let sess = chatSessions.find(s => s.id === currentSessionId);
        if (sess) {
          sess.messages.push({ sender, content });
          localStorage.setItem('omni_chat_sessions', JSON.stringify(chatSessions));
        }
      }
      return innerDiv;
    }

    async function generateAIContent(prompt, media) {
      const apiKey = localStorage.getItem('gemini_api_key') || '';
      if (!apiKey) {
        appendMessage('bot', '⚠️ **Gemini API Key missing:** Sidebar me **⚙️ Key** button par click karke apni free Gemini API key enter karein.');
        return;
      }

      const botMsgElement = appendMessage('bot', '*Soch raha hoon...*');
      let parts = [];
      if (media && media.type === 'image') {
        parts.push({
          inline_data: {
            mime_type: media.mimeType,
            data: media.dataUrl.split(',')[1]
          }
        });
      }
      parts.push({ text: `System: Polite AI Assistant. User Query: ${prompt}` });

      const modelsToTry = ['gemini-1.5-flash', 'gemini-1.5-pro', 'gemini-pro'];
      let replyFound = false;

      for (const model of modelsToTry) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts }] })
          });
          const data = await response.json();
          if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
            const reply = data.candidates[0].content.parts[0].text;
            botMsgElement.innerHTML = marked.parse(reply);
            botMsgElement.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
            speakText(reply);
            replyFound = true;
            break;
          }
        } catch (err) {
          console.error(err);
        }
      }

      if (!replyFound) {
        botMsgElement.innerText = 'Error: Response nahi mil paya. Kripya API key check karein.';
      }
      document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
    }

    function generateImage(prompt) {
      const botMsgElement = appendMessage('bot', `🎨 *Image create ho rahi hai:* "${prompt}"...`);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=800&height=800&nologo=true`;
      const img = new Image();
      img.src = imageUrl;
      img.className = 'mt-3 rounded-xl border border-gray-700 max-w-full h-auto';
      img.onload = () => {
        botMsgElement.innerHTML = `<div><strong>Result:</strong> ${prompt}</div>`;
        botMsgElement.appendChild(img);
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
      };
      img.onerror = () => { botMsgElement.innerText = 'Image create karne me error aaya.'; };
    }

    function speakText(text) {
      if (!document.getElementById('voiceToggle').checked || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[*_#`]/g, '').slice(0, 180));
      u.lang = 'hi-IN';
      window.speechSynthesis.speak(u);
    }

    renderHistory();
    updateUserBadge();
  </script>
</body>
</html>
